apiVersion: v1
kind: Service
metadata:
  name: infra-terminal
  namespace: code-agent
  labels:
    app: infra-terminal
    tier: code-agent
    environment: pilot
spec:
  type: ClusterIP
  selector:
    app: infra-terminal
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
