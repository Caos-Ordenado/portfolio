apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: infra-terminal-isolation
  namespace: code-agent
  labels:
    app: infra-terminal
spec:
  podSelector:
    matchLabels:
      app: infra-terminal
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
          podSelector:
            matchLabels:
              app: openwebui
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # Same-namespace diagnostics only; no API token is mounted in this terminal.
    - to:
        - podSelector:
            matchLabels:
              app: cluster-diagnostics
      ports:
        - protocol: TCP
          port: 8002
    - to:
        - podSelector:
            matchLabels:
              app: infra-pr-broker
      ports:
        - protocol: TCP
          port: 8001
