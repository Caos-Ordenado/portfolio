apiVersion: apps/v1
kind: Deployment
metadata:
  name: infra-pr-broker
  namespace: code-agent
  labels:
    app: infra-pr-broker
    tier: code-agent
    environment: pilot
spec:
  # Keep inactive until the reviewed PR is merged and runtime checks pass.
  replicas: 0
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: infra-pr-broker
  template:
    metadata:
      labels:
        app: infra-pr-broker
        tier: code-agent
        environment: pilot
        version: pilot-6-review
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: infra-pr-broker
          image: docker.io/library/code-agent-pr-broker@sha256:4c7e3b6fb00d292c6111d356efb846267041cc0be3e9ca10bd6b194f2f2c03e0
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8001
              protocol: TCP
          env:
            - name: REVIEW_REPOSITORY
              value: infra
            - name: REVIEW_SNAPSHOT_SHA
              valueFrom:
                configMapKeyRef:
                  name: infra-review-snapshot
                  key: MAIN_SHA
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: code-agent-github-app
                  key: APP_ID
            - name: GITHUB_INSTALLATION_ID
              valueFrom:
                secretKeyRef:
                  name: code-agent-github-app
                  key: INSTALLATION_ID
            - name: GITHUB_APP_PEM_PATH
              value: /run/secrets/github-app/private-key.pem
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          volumeMounts:
            - name: github-app-key
              mountPath: /run/secrets/github-app
              readOnly: true
            - name: tmp
              mountPath: /tmp
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: github-app-key
          secret:
            secretName: code-agent-github-app
            defaultMode: 0440
            items:
              - key: private-key.pem
                path: private-key.pem
