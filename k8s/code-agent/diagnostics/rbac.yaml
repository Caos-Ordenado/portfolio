apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: code-agent-cluster-diagnostics
  labels:
    app: cluster-diagnostics
rules:
  - apiGroups: [""]
    resources: [pods, nodes, namespaces, events, services, endpoints, serviceaccounts, persistentvolumeclaims, persistentvolumes]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments, replicasets, daemonsets, statefulsets]
    verbs: [get, list]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies, ingresses]
    verbs: [get, list]
  - apiGroups: [traefik.io]
    resources: [ingressroutes]
    verbs: [get, list]
  - apiGroups: [metrics.k8s.io]
    resources: [pods, nodes]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: code-agent-cluster-diagnostics
  labels:
    app: cluster-diagnostics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: code-agent-cluster-diagnostics
subjects:
  - kind: ServiceAccount
    name: cluster-diagnostics
    namespace: code-agent
