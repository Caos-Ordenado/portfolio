apiVersion: v1
kind: Service
metadata:
  name: code-agent-pr-broker
  namespace: code-agent
  labels:
    app: code-agent-pr-broker
    tier: code-agent
    environment: pilot
spec:
  type: ClusterIP
  selector:
    app: code-agent-pr-broker
  ports:
    - name: http
      port: 8001
      targetPort: http
      protocol: TCP
