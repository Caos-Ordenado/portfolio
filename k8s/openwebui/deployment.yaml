apiVersion: apps/v1
kind: Deployment
metadata:
  name: openwebui
  namespace: default
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # Schema migrations run at startup; never overlap different app versions.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: openwebui
  template:
    metadata:
      labels:
        app: openwebui
    spec:
      containers:
        - name: openwebui
          image: ghcr.io/open-webui/open-webui:v0.11.4
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - secretRef:
                name: openwebui-secrets
          env:
            # List only the stable llama-swap aliases in Open WebUI, not their
            # backing model IDs (which have identical display names).
            - name: OPENAI_API_CONFIGS
              value: '{"0":{"model_ids":["coder","extract","reasoning","vision"]}}'
            # No API key is needed for the built-in DuckDuckGo search provider.
            - name: ENABLE_WEB_SEARCH
              value: "true"
            - name: WEB_SEARCH_ENGINE
              value: "ddgs"
          # NOTE: Keep probes path-agnostic because WebUI may redirect on /.
          # First boot can take several minutes (model/asset downloads); without this,
          # liveness/readiness fight slow startup and rollouts look "stuck".
          startupProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 2Gi


