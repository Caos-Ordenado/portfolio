apiVersion: v1
kind: Secret
metadata:
  name: openwebui-secrets
  namespace: default
type: Opaque
stringData:
  # PostgreSQL backing store (no SQLite persistence)
  # Example: postgresql://openwebui_user:<password>@postgres.shared.svc.cluster.local:5432/openwebui
  DATABASE_URL: __OPENWEBUI_DATABASE_URL__

  # In-cluster llama-swap gateway (OpenAI-compatible API, runs locally on caos; no external provider)
  ENABLE_OLLAMA_API: "false"
  OPENAI_API_BASE_URL: http://llama.default.svc.cluster.local:8080/v1
  OPENAI_API_KEY: local-no-auth

  # App secret (generated by k8s/secrets/scripts/generate-secrets.sh)
  WEBUI_SECRET_KEY: __SERVER_SECRET_KEY__

  # Canonical public URL (HTTPS). Private Tailscale access still uses webui.home.server:30080 in browser.
  WEBUI_URL: https://chat.reyops.com/




