name: openwebui-tools PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Compile service and shared Python sources
        run: python3 -m compileall -q services/openwebui_tools/src shared/shared/shared
      - name: Check existing shell deploy helper syntax (never execute it)
        run: bash -n services/openwebui_tools/deploy.sh
      - name: Build tracked service inputs on isolated hosted runner and smoke-test
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          container="openwebui-tools-pr-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true; rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/context"
          # Same committed input allowlist/layout as trusted deploy; no workspace .env,
          # ignored files, credentials or parent-repository files in the build context.
          git archive HEAD -- services/openwebui_tools/Dockerfile services/openwebui_tools/README.md services/openwebui_tools/pyproject.toml services/openwebui_tools/src shared/shared/pyproject.toml shared/shared/README.md shared/shared/shared | tar -xf - -C "$tmp/context"
          mv "$tmp/context/services/openwebui_tools" "$tmp/context/openwebui_tools"
          mv "$tmp/context/shared/shared" "$tmp/shared-package"
          rmdir "$tmp/context/shared"
          mv "$tmp/shared-package" "$tmp/context/shared"
          docker build --file "$tmp/context/openwebui_tools/Dockerfile" --tag openwebui-tools:pr-check "$tmp/context"
          docker run --detach --name "$container" --publish 127.0.0.1:18080:8000 openwebui-tools:pr-check
          for attempt in {1..30}; do
            printf 'Waiting for /health (attempt %s/30)\n' "$attempt"
            if curl --fail --silent --max-time 3 http://127.0.0.1:18080/health > "$tmp/health.json"; then
              break
            fi
            if test "$(docker inspect --format '{{.State.Running}}' "$container")" != true; then
              docker logs "$container"
              exit 1
            fi
            sleep 2
          done
          curl --fail --silent --show-error --max-time 5 http://127.0.0.1:18080/health > "$tmp/health.json"
          curl --fail --silent --show-error --max-time 5 http://127.0.0.1:18080/openapi.json > "$tmp/openapi.json"
          python3 -m json.tool "$tmp/health.json" > /dev/null
          python3 -m json.tool "$tmp/openapi.json" > /dev/null
